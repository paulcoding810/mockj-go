name: Docker Image Testing

on:
  workflow_call:
    inputs:
      image_ref:
        description: "Image reference to test"
        required: true
        type: string
      version:
        description: "Version being tested"
        required: false
        type: string
        default: "latest"

jobs:
  test-image:
    runs-on: ubuntu-latest

    services:
      mockj-go:
        image: ${{ inputs.image_ref }}
        ports:
          - 8080:8080
        volumes:
          - /tmp/mockj-data:/app/data
        env:
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: 8080
          DATABASE_URL: /app/data/mockj.db
          DATABASE_CLEANUP_INTERVAL: 1h
          RATE_LIMIT_ENABLED: true
          RATE_LIMIT_REQUESTS: 100
          RATE_LIMIT_WINDOW: 1m

    steps:
      - name: Wait for service to be ready
        run: |
          echo "⏳ Waiting for MockJ-Go to be ready..."
          sleep 30

      - name: Test health endpoint
        run: |
          echo "🏥 Testing health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$response" = "200" ]; then
            echo "✅ Health endpoint is working"
          else
            echo "❌ Health endpoint failed with status: $response"
            exit 1
          fi

      - name: Test API endpoints
        run: |
          echo "🔧 Testing API endpoints..."

          # Test creating a JSON endpoint
          create_response=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"json":"{\"test\": \"data\", \"version\": \"${{ inputs.version }}\"}"}' \
            http://localhost:8080/api/json)

          echo "Create response: $create_response"

          # Extract ID from response
          id=$(echo "$create_response" | jq -r '.data.id')

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "❌ Failed to create JSON endpoint"
            exit 1
          fi

          echo "✅ JSON endpoint created with ID: $id"

      - name: Test JSON retrieval
        run: |
          echo "📥 Testing JSON retrieval..."

          # Get the ID from previous step (would need to pass between steps)
          id=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"json":"{\"test\": \"retrieve\"}"}' \
            http://localhost:8080/api/json | jq -r '.data.id')

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "❌ Failed to get ID for retrieval test"
            exit 1
          fi

          get_response=$(curl -s http://localhost:8080/api/json/$id)
          echo "Get response: $get_response"

          # Check if response contains expected data
          if echo "$get_response" | jq -e '.data.json | contains("retrieve")' > /dev/null; then
            echo "✅ JSON metadata retrieval working"
          else
            echo "❌ JSON metadata retrieval failed"
            exit 1
          fi

          # Check the raw content endpoint returns the stored JSON verbatim
          content_response=$(curl -s http://localhost:8080/api/json/$id/content)
          echo "Content response: $content_response"

          if echo "$content_response" | jq -e '.test == "retrieve"' > /dev/null; then
            echo "✅ Raw content retrieval working"
          else
            echo "❌ Raw content retrieval failed"
            exit 1
          fi

      - name: Test endpoint expiration handling
        run: |
          echo "⏰ Testing expired endpoint handling..."

          # Create endpoint that expires in 1 hour
          id=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"json":"{\"test\": \"expire\"}", "expires":"'$(date -u -d '+1 hour' +'%Y-%m-%dT%H:%M:%S.%3NZ')'"}' \
            http://localhost:8080/api/json | jq -r '.data.id')

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "❌ Failed to create expiring endpoint"
            exit 1
          fi

          # This endpoint should still be accessible (created within last hour)
          get_response=$(curl -s http://localhost:8080/api/json/$id)

          if echo "$get_response" | jq -e '.data.json | contains("expire")' > /dev/null; then
            echo "✅ Expiring endpoint created successfully"
          else
            echo "❌ Expiring endpoint failed"
            exit 1
          fi

      - name: Test web interface
        run: |
          echo "🌐 Testing web interface..."

          # Test if web interface loads
          web_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)

          if [ "$web_response" = "200" ]; then
            echo "✅ Web interface is accessible"
          else
            echo "❌ Web interface not accessible (status: $web_response)"
            exit 1
          fi

      - name: Test rate limiting
        run: |
          echo "🚦 Testing rate limiting..."

          # Make multiple rapid requests to test rate limiting
          success_count=0
          for i in {1..10}; do
            web_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
            if [ "$web_response" = "200" ]; then
              success_count=$((success_count + 1))
            fi
            sleep 0.1
          done

          echo "Successful requests out of 10: $success_count"

          if [ $success_count -eq 10 ]; then
            echo "⚠️ Rate limiting may not be active (or configured for higher limits)"
          else
            echo "✅ Rate limiting appears to be working"
          fi

  security-scan:
    runs-on: ubuntu-latest
    needs: test-image

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image_ref }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-results.sarif"

  notify:
    needs: [test-image, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "📊 Docker Image Test Summary"
          echo "================================"
          echo "Image: ${{ inputs.image_ref }}"
          echo "Version: ${{ inputs.version }}"
          echo ""

          # Collect test results
          if [ "${{ needs.test-image.result }}" = "success" ]; then
            echo "✅ Functional Tests: PASSED"
          else
            echo "❌ Functional Tests: FAILED"
          fi

          if [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ Security Scan: PASSED"
          else
            echo "❌ Security Scan: FAILED"
          fi
